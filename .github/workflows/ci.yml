name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv venv --clear
          # CPU-only torch: the default Linux wheel bundles ~2 GB of CUDA libs we never use.
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -r requirements.txt ruff mypy

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy ingestion retrieval inference api eval

      # No Qdrant/Ollama/model downloads needed. Add an actions/cache step for
      # ~/.cache/huggingface once tests start loading the embedding/reranker models.
      - name: Unit tests (no services)
        run: uv run pytest tests -v
